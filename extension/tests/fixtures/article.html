      <p>这是第一段正文。它需要足够长，好让 Readability 能把这一段当作正文段落而不是噪声，因此这里重复一些说明性的文字。</p>
      <p>第二段正文继续补充内容，确保整体文本量超过五十个字符的门槛，并且语句之间保持自然。</p>
      <figure>

      <figure><img src="data:image/png;base64,AAAA" alt="内嵌图"></figure>
      <table>
        <tr><th>列A</th><th>列B</th></tr>
        <tr><td>1</td><td>2</td></tr>
      </table>
      <pre><code>const answer = 42;</code></pre>
      <p>结尾段落也写得长一些，方便断言正文提取的结果里包含这一段文字。</p>
